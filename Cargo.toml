[package]
name = "fracterm"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "A spatial terminal emulator with live text surfaces, projections, lenses, and commands."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
strip = true